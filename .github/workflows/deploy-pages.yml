name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unpack phone upload if source is not present
        shell: bash
        run: |
          if [ ! -f scripts/build-pages.mjs ]; then
            python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('project-source.zip') as archive:
              for member in archive.infolist():
                  target = Path(member.filename)
                  if target.is_absolute() or '..' in target.parts:
                      raise ValueError('Invalid archive path')
                  if target.parts and target.parts[0] in ('.git', '.github'):
                      continue
                  archive.extract(member)
          PY
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and check static Pages directory
        run: |
          npm run build:pages
          npm run test:data
          npm run test:feeds
          npm run test:pages
          npm run test:ai
          npm run test:quality
          npm run typecheck
          npm run lint
          npm run build
          npm run build:pages
      - name: Real browser regression of generated static artifact
        shell: bash
        run: |
          node scripts/create-browser-regression.mjs
          CHROME_BIN=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME_BIN" ]; then
            echo 'A real Chrome browser is required for this regression test'
            exit 1
          fi
          "$CHROME_BIN" --headless --no-sandbox --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=15000 --dump-dom "file://$PWD/artifacts/browser-regression.html" > artifacts/browser-regression-dom.html
          node scripts/check-browser-result.cjs
      - name: Approved bilingual publication at 390px
        shell: bash
        run: |
          node scripts/create-publication-regression.mjs
          CHROME_BIN=$(command -v google-chrome || command -v chromium)
          "$CHROME_BIN" --headless --no-sandbox --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=15000 --dump-dom "file://$PWD/artifacts/publication-browser-check.html" > artifacts/publication-browser-dom.html
          node scripts/check-publication-result.cjs
      - name: Next.js mobile navigation parity in Chrome
        run: node scripts/verify-next-navigation.mjs
      - name: Upload browser regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-${{ github.run_id }}
          path: |
            artifacts/*browser*.html
            artifacts/next-browser-result.json
          if-no-files-found: warn
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static page
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare published runtime and click all views in Chrome
        shell: bash
        run: |
          node scripts/build-pages.mjs
          mkdir -p artifacts
          curl --fail --location --retry 3 --retry-delay 5 --max-time 30 "https://jasper231.github.io/ai-frontier-dashboard/?verification=${{ github.run_id }}" -o artifacts/live-pages.html
          node scripts/verify-live-pages.cjs
          CHROME_BIN=$(command -v google-chrome || command -v chromium)
          "$CHROME_BIN" --headless --no-sandbox --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=3000 --dump-dom "file://$PWD/artifacts/live-browser-check.html" > artifacts/live-browser-dom.html
          node scripts/check-live-result.cjs
      - name: Verify actual published briefing in Chinese and English at 390px
        shell: bash
        run: |
          node scripts/create-publication-regression.mjs artifacts/live-pages.html artifacts/live-publication-browser-check.html
          CHROME_BIN=$(command -v google-chrome || command -v chromium)
          "$CHROME_BIN" --headless --no-sandbox --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=15000 --dump-dom "file://$PWD/artifacts/live-publication-browser-check.html" > artifacts/live-publication-browser-dom.html
          node scripts/check-publication-result.cjs artifacts/live-publication-browser-dom.html
      - name: Save live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-verification-${{ github.run_id }}
          path: artifacts/live-*
          if-no-files-found: warn

