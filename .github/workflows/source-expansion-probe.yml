name: Probe publisher-owned public feeds
on:
  push:
    branches: [source-health-probe-20261008]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/probe-sources.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-expansion-probe
          path: artifacts/source-probe.json
