name: Prepare Briefing inputs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare v2 evidence and editorial task without model calls
        run: node scripts/prepare-briefing.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: briefing-agent-inputs-${{ github.run_id }}
          path: artifacts/briefing-agent/
