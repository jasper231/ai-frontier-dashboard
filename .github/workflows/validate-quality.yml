name: Validate Free Frontier Quality
on:
  push:
    branches: [quality-validation-20261004]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: All quality and existing checks
        run: |
          npm run build:pages
          npm run test:data
          npm run test:feeds
          npm run test:pages
          npm run test:ai
          npm run test:quality
          npm run typecheck
          npm run lint
          npm run build:pages
      - name: Four views and mobile layout in Chrome
        run: |
          node scripts/create-browser-regression.mjs
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=5000 --dump-dom "file://$PWD/artifacts/browser-regression.html" > artifacts/browser-regression-dom.html
          node scripts/check-browser-result.cjs
      - name: Verify additional public feeds without changing snapshots
        if: always()
        run: node scripts/check-public-sources.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-quality-validation
          path: |
            artifacts/public-source-check.json
            artifacts/browser-regression*.html
