name: Validate public source adapters
on:
  push:
    branches: [frontier-source-probe-20261008]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-public-sources.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: public-source-check
          path: artifacts/public-source-check.json
